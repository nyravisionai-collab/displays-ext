<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>કંટ્રોલર</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  body { font-family: system-ui, Roboto, sans-serif; min-height:100vh;
    background: linear-gradient(170deg, #0f2027, #203a43, #2c5364); color:#fff; padding:16px 16px 40px; }
  .wrap { max-width:440px; margin:0 auto; }
  header { text-align:center; margin-bottom:10px; }
  header h1 { font-size:18px; }
  header .room { font-size:13px; opacity:.7; margin-top:2px; }
  #pill { display:inline-block; margin-top:8px; background:rgba(0,0,0,.4); padding:5px 14px; border-radius:999px; font-size:12px; color:#9fffd9; }

  .card { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; margin:14px 0; }
  .lbl { font-size:11px; opacity:.6; letter-spacing:1px; text-transform:uppercase; }
  .title { font-size:16px; font-weight:700; margin:4px 0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .times { display:flex; justify-content:space-between; font-size:12px; opacity:.8; margin-top:6px; }
  input[type=range] { width:100%; accent-color:#22d3a0; height:28px; }

  .trans { display:flex; align-items:center; justify-content:center; gap:16px; margin:18px 0 6px; }
  .cbtn { border:none; border-radius:16px; color:#0b1a20; font-weight:700; cursor:pointer; }
  .cbtn.med { width:64px; height:64px; font-size:15px; background:rgba(255,255,255,.9); }
  .cbtn.big { width:92px; height:92px; font-size:38px; border-radius:50%; background:#22d3a0; box-shadow:0 8px 24px rgba(34,211,160,.35); }
  .cbtn:active { transform:scale(.93); }
  .cbtn:disabled { opacity:.4; }

  .vol .row2 { display:flex; align-items:center; gap:10px; }
  .vol .row2 span { font-size:18px; width:22px; text-align:center; }
  .vol .cbtn { width:52px; height:44px; font-size:18px; border-radius:12px; background:rgba(255,255,255,.85); }
  .vol .cbtn.on { background:#ff8a8a; }

  .pick { text-align:center; }
  #file { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .filePick { display:block; width:100%; padding:16px; border-radius:12px; background:#22d3a0; color:#06251c; font-weight:700; font-size:15px; cursor:pointer; }
  .filePick.small { background:rgba(255,255,255,.15); color:#fff; font-weight:600; font-size:13px; padding:12px; margin-top:10px; }
  .hint { font-size:12px; opacity:.6; margin-top:10px; line-height:1.5; }
  #uploadStatus { display:none; margin-top:12px; font-size:12px; line-height:1.5; color:#bfffe9; text-align:left; }
  #uploadProgress { width:100%; height:8px; margin-top:6px; accent-color:#22d3a0; }
  #installBtn { display:none; width:100%; padding:12px; margin-top:10px; border:1px solid rgba(255,255,255,.35); border-radius:12px;
    background:rgba(255,255,255,.12); color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 કંટ્રોલર</h1>
    <div class="room" id="roomTag">—</div>
    <div id="pill">કનેક્ટ થઈ રહ્યું છે…</div>
    <button id="installBtn" data-rvc-install>📲 એપ તરીકે ઇન્સ્ટોલ કરો</button>
  </header>

  <!-- Step 1: pick video from gallery -->
  <div class="card pick" id="pickCard">
    <input id="file" type="file" accept="video/*">
    <label class="filePick" for="file" id="pickLabel">📁 ગેલેરીમાંથી વિડિયો પસંદ કરો</label>
    <div class="hint">પસંદ કરેલો વિડિયો સીધો જૂના ફોન (પ્લેયર) પર ચાલશે.<br>"✓ સેવ થઈ ગયો" દેખાય પછી આ પેજ બંધ કરીને પણ વિડિયો ચાલુ રહેશે.</div>
    <div id="uploadStatus">
      <span id="uploadText">—</span>
      <progress id="uploadProgress" max="100" value="0"></progress>
    </div>
  </div>

  <!-- Step 2: controls -->
  <div class="card" id="ctrlCard">
    <div class="lbl">હવે વાગી રહ્યું છે</div>
    <div class="title" id="npTitle">કોઈ વિડિયો પસંદ કરેલ નથી</div>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <div class="times"><span id="curT">0:00</span><span id="durT">0:00</span></div>

    <div class="trans">
      <button class="cbtn med" id="backBtn">⏪ 10s</button>
      <button class="cbtn big" id="playBtn">▶</button>
      <button class="cbtn med" id="fwdBtn">10s ⏩</button>
    </div>

    <div class="vol" style="margin-top:14px">
      <div class="row2">
        <span>🔊</span>
        <input id="vol" type="range" min="0" max="100" value="100">
        <button id="muteBtn" class="cbtn">🔇</button>
      </div>
    </div>
  </div>
</div>

<script src="pwa.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var room = (params.get('room') || '').trim();
  var PEER_PREFIX = 'rvideo-';
  document.getElementById('roomTag').textContent = 'રૂમ: ' + room;
  if (window.rvcSaveSession && room) rvcSaveSession(room, 'controller');

  var peer = null, conn = null, connected = false;
  var mediaCall = null, streamSourceUrl = '', streamingMode = false, hasVideo = false;
  var streamSource = document.createElement('video');
  streamSource.setAttribute('playsinline', '');
  streamSource.muted = true;                // local playback is silent; audio goes over the stream track
  streamSource.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(streamSource);

  var seeking = false, uploading = false, muted = false;
  var duration = 0;
  var CHUNK_SIZE = 64 * 1024;
  var MAX_BUFFERED = 1024 * 1024;

  var pill = document.getElementById('pill');
  var npTitle = document.getElementById('npTitle');
  var seekEl = document.getElementById('seek');
  var curT = document.getElementById('curT');
  var durT = document.getElementById('durT');
  var playBtn = document.getElementById('playBtn');
  var volEl = document.getElementById('vol');
  var muteBtn = document.getElementById('muteBtn');
  var pickLabel = document.getElementById('pickLabel');
  var status = document.getElementById('uploadStatus');
  var text = document.getElementById('uploadText');
  var progress = document.getElementById('uploadProgress');

  function setPill(t, ok){ pill.textContent = t; pill.style.color = ok === false ? '#ff8a8a' : (ok ? '#9fffd9' : '#ffd88a'); }
  function fmt(s){ s = Math.max(0, Math.floor(s||0)); var m = Math.floor(s/60), sec = s%60; return m + ':' + (sec<10?'0':'') + sec; }
  function send(obj){ if (!conn || conn.open !== true) return; try { conn.send(obj); } catch(e) {} }

  function setPlaying(p){ playBtn.textContent = p ? '⏸' : '▶'; }
  function setTime(t, d){
    if (typeof d === 'number' && d > 0) { duration = d; durT.textContent = fmt(d); }
    if (!seeking) { curT.textContent = fmt(t); if (duration) seekEl.value = Math.round((t / duration) * 1000); }
  }

  // ---- commands ----
  function cmd(name, value){
    if (!connected) { setPill('પ્લેયર હજુ જોડાયેલું નથી', false); return; }
    if (!hasVideo && name !== 'volume' && name !== 'mute') { setPill('પહેલા વિડિયો પસંદ કરો'); return; }
    if (streamingMode) {
      // We are the source of the stream, so control the local hidden video.
      if (name === 'toggle') { if (streamSource.paused) streamSource.play().catch(function(){}); else streamSource.pause(); }
      else if (name === 'seek') { try { streamSource.currentTime = Math.max(0, Math.min(duration || 1e9, value)); } catch(e) {} }
      else if (name === 'skip') { try { streamSource.currentTime = Math.max(0, streamSource.currentTime + value); } catch(e) {} }
      else if (name === 'volume') send({type:'cmd', cmd:'volume', value:value});
      else if (name === 'mute') send({type:'cmd', cmd:'mute'});
      return;
    }
    if (name === 'toggle') send({type:'cmd', cmd:'toggle'});
    else if (name === 'seek') send({type:'cmd', cmd:'seek', value:value});
    else if (name === 'skip') send({type:'cmd', cmd:'skip', value:value});
    else if (name === 'volume') send({type:'cmd', cmd:'volume', value:value});
    else if (name === 'mute') send({type:'cmd', cmd:'mute'});
  }

  function stopStreaming(){
    streamingMode = false;
    streamSource.pause();
    streamSource.removeAttribute('src'); streamSource.load();
    if (mediaCall) { try { mediaCall.close(); } catch(e){} mediaCall = null; }
    if (streamSourceUrl) { URL.revokeObjectURL(streamSourceUrl); streamSourceUrl = ''; }
  }

  playBtn.addEventListener('click', function(){ cmd('toggle'); });
  document.getElementById('backBtn').addEventListener('click', function(){ cmd('skip', -10); });
  document.getElementById('fwdBtn').addEventListener('click', function(){ cmd('skip', 10); });

  seekEl.addEventListener('input', function(){ seeking = true; if (duration) curT.textContent = fmt((seekEl.value/1000) * duration); });
  seekEl.addEventListener('change', function(){ seeking = false; if (duration > 0) cmd('seek', (seekEl.value/1000) * duration); });

  volEl.addEventListener('input', function(){ cmd('volume', Number(volEl.value)/100); });
  muteBtn.addEventListener('click', function(){ cmd('mute'); muted = !muted; muteBtn.classList.toggle('on', muted); });

  function waitForBuffer(){
    return new Promise(function(resolve){
      function check(){
        var dc = conn && conn.dataChannel;
        if (!conn || !conn.open) { resolve(false); return; }
        if (!dc || dc.bufferedAmount < MAX_BUFFERED) { resolve(true); return; }
        setTimeout(check, 30);
      }
      check();
    });
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // સંપૂર્ણ ફાઇલ chunks માં મોકલો. લાઇવ સ્ટ્રીમ સાથે સાથે ચાલે (background ટ્રાન્સફર),
  // પૂરો થાય એટલે પ્લેયર પાસે વિડિયો સેવ થઈ જાય → પછી આ પેજ બંધ કરી શકાય.
  async function sendFileInBackground(file){
    var transferId = Date.now() + '-' + Math.random().toString(36).slice(2);
    var totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    try {
      send({ type:'file-start', id:transferId, name:file.name, mime:file.type || 'video/mp4', size:file.size, total:totalChunks });
      for (var i = 0; i < totalChunks; i++) {
        var ready = await waitForBuffer();
        if (!ready) throw new Error('connection closed');
        var data = await file.slice(i * CHUNK_SIZE, Math.min(file.size, (i + 1) * CHUNK_SIZE)).arrayBuffer();
        conn.send({ type:'file-chunk', id:transferId, index:i, data:data });
        var pct = Math.round(((i + 1) / totalChunks) * 100);
        progress.value = pct;
        if (pct % 5 === 0 || i + 1 === totalChunks) {
          text.textContent = streamingMode
            ? '● લાઇવ ચાલે છે · પ્લેયર પર સેવ થઈ રહ્યો છે… ' + pct + '%'
            : 'વિડિયો મોકલાઈ રહ્યો છે… ' + pct + '%';
        }
        if (streamingMode) await sleep(15);   // લાઇવ સ્ટ્રીમ ને બગાડે નહીં એ માટે હળવો વિરામ
      }
      send({ type:'file-end', id:transferId });
      text.textContent = streamingMode ? '● લાઇવ ચાલે છે · સેવ થઈ રહ્યો છે… 100%' : 'વિડિયો મોકલાઈ ગયો — પ્લેયરમાં તૈયાર થઈ રહ્યો છે…';
    } catch(err) {
      text.textContent = 'વિડિયો મોકલવામાં ભૂલ આવી. ફરી પ્રયત્ન કરો.';
    } finally {
      uploading = false;
    }
  }

  // ---- gallery pick ----
  document.getElementById('file').addEventListener('change', async function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!connected || !conn || !conn.open) {
      alert('પહેલા જૂના ફોનમાં પ્લેયર ખોલો (એ જ કોડ), પછી વિડિયો પસંદ કરો.');
      e.target.value = '';
      return;
    }
    if (uploading) { alert('એક વિડિયો પહેલેથી મોકલાઈ રહ્યો છે.'); e.target.value=''; return; }

    npTitle.textContent = file.name;
    duration = 0; setTime(0, 0); seekEl.value = 0;
    status.style.display = 'block';

    // Preferred: live stream via WebRTC (starts instantly).
    var capture = streamSource.captureStream || streamSource.mozCaptureStream;
    if (capture && peer && typeof peer.call === 'function') {
      stopStreaming();
      progress.removeAttribute('value');
      text.textContent = 'લાઇવ સ્ટ્રીમ શરૂ થઈ રહ્યું છે…';
      streamSourceUrl = URL.createObjectURL(file);
      streamSource.src = streamSourceUrl;
      try {
        await new Promise(function(resolve, reject){
          streamSource.onloadedmetadata = resolve;
          streamSource.onerror = reject;
          streamSource.load();
        });
        // captureStream on a muted element gives no audio in some browsers → unmute but volume 0 via track
        streamSource.muted = false; streamSource.volume = 0;
        var playPromise = streamSource.play();
        if (playPromise) await playPromise;
        var mediaStream = capture.call(streamSource);
        if (!mediaStream || !mediaStream.getTracks().length) throw new Error('empty stream');
        mediaCall = peer.call(PEER_PREFIX + room, mediaStream, { metadata:{ name:file.name, duration:streamSource.duration || 0 } });
        streamingMode = true; hasVideo = true;
        setTime(0, streamSource.duration || 0);
        progress.removeAttribute('value');
        text.textContent = '● લાઇવ ચાલે છે · પ્લેયર પર સેવ થઈ રહ્યો છે…';
        pickLabel.textContent = '📁 બીજો વિડિયો પસંદ કરો';
        mediaCall.on('close', function(){ if (streamingMode) { text.textContent = 'સ્ટ્રીમ બંધ થયું'; } });
        e.target.value = '';
        // લાઇવ સ્ટ્રીમ સાથે સાથે સંપૂર્ણ ફાઇલ પણ background માં મોકલો —
        // પ્લેયર પાસે સેવ થઈ જાય પછી આ પેજ બંધ કરીએ તો પણ વિડિયો ચાલુ રહે.
        uploading = true;
        sendFileInBackground(file);
        return;
      } catch(err) {
        stopStreaming();
        progress.value = 0;
        text.textContent = 'લાઇવ સ્ટ્રીમ ઉપલબ્ધ નથી — ફાઇલ સીધી મોકલાઈ રહી છે…';
      }
    }

    // Fallback: આખી ફાઇલ chunks માં મોકલો.
    uploading = true;
    progress.value = 0;
    await sendFileInBackground(file);
    e.target.value = '';
  });

  // local stream source → UI
  streamSource.addEventListener('timeupdate', function(){ if (streamingMode) { setTime(streamSource.currentTime, streamSource.duration || 0); setPlaying(!streamSource.paused); } });
  streamSource.addEventListener('play', function(){ if (streamingMode) setPlaying(true); });
  streamSource.addEventListener('pause', function(){ if (streamingMode) setPlaying(false); });
  streamSource.addEventListener('ended', function(){ if (streamingMode) setPlaying(false); });

  // ---- PeerJS ----
  function connect(){
    if (!window.Peer) { setPill('PeerJS લોડ ન થયું — ઇન્ટરનેટ ચેક કરો', false); return; }
    peer = new Peer();
    peer.on('open', function(){
      setPill('પ્લેયર શોધી રહ્યા છીએ…');
      conn = peer.connect(PEER_PREFIX + room, { reliable: true });
      conn.on('open', function(){ connected = true; setPill('પ્લેયર જોડાયેલ છે ✓', true); send({type:'hello'}); });
      conn.on('data', handleMsg);
      conn.on('close', function(){ connected = false; setPill('પ્લેયર છૂટું પડ્યું', false); });
      conn.on('error', function(){ connected = false; setPill('કનેક્શન ભૂલ', false); });
    });
    peer.on('error', function(err){
      var t = 'કનેક્શન ભૂલ';
      if (err && err.type === 'peer-unavailable') t = 'પ્લેયર નથી — જૂના ફોનમાં Player ખોલો (એ જ કોડ)';
      setPill(t, false);
    });
    peer.on('disconnected', function(){ if (!peer.destroyed) peer.reconnect(); });
  }

  function handleMsg(m){
    if (!m) return;
    if (m.type === 'status') {
      if (streamingMode) return;              // in streaming mode local source is the truth
      setTime(m.time, m.duration);
      setPlaying(m.playing);
      if (typeof m.muted === 'boolean') { muted = m.muted; muteBtn.classList.toggle('on', muted); }
    } else if (m.type === 'file-ready') {
      hasVideo = true;
      progress.value = 100;
      if (streamingMode) {
        // સંપૂર્ણ વિડિયો પ્લેયર પર સેવ થઈ ગયો → લાઇવ સ્ટ્રીમ બંધ કરો, હવેથી પ્લેયર પોતાની પાસે રાખેલો વિડિયો ચલાવે.
        stopStreaming();
        text.textContent = '✓ વિડિયો પ્લેયર પર સેવ થઈ ગયો — આ પેજ બંધ કરીને પણ વિડિયો ચાલુ રહેશે';
      } else {
        text.textContent = '✓ વિડિયો પ્લેયરમાં ચાલી રહ્યો છે';
      }
      pickLabel.textContent = '📁 બીજો વિડિયો પસંદ કરો';
      npTitle.textContent = m.name || 'ફોનનો વિડિયો';
    } else if (m.type === 'ended') {
      setPlaying(false);
    }
  }

  if (!room) { setPill('રૂમ કોડ ખૂટે છે', false); }
  else connect();
})();
</script>
</body>
</html>
