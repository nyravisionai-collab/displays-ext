<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>વિડિયો પ્લેયર</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:#000; color:#fff; font-family: system-ui, Roboto, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; background:#000; }
  video { width:100%; height:100%; background:#000; object-fit: contain; display:block; }

  /* idle screen shown when no video yet */
  #idle { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; z-index:10;
    background: radial-gradient(circle at 50% 40%, #1b2f3a, #000 70%); }
  #idle .ic { font-size:56px; margin-bottom:14px; }
  #idle h2 { font-size:18px; margin-bottom:8px; }
  #idle p { font-size:13px; opacity:.7; line-height:1.6; }
  #idle .codeTag { margin-top:18px; background:#1a2733; border:1px solid #3a4a5a; padding:8px 18px; border-radius:12px; font-size:24px; letter-spacing:4px; }
  #idle.hidden { display:none; }

  /* top status */
  #top { position:fixed; top:0; left:0; right:0; z-index:20; padding:12px; text-align:center; pointer-events:none;
    background:linear-gradient(rgba(0,0,0,.7), transparent); transition:opacity .3s; }
  #pill { background:rgba(0,0,0,.55); padding:5px 14px; border-radius:999px; font-size:12px; color:#9fffd9; display:inline-block; }

  /* bottom overlay */
  #bar { position:fixed; bottom:0; left:0; right:0; z-index:20; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, rgba(0,0,0,.85)); transition:opacity .3s; }
  #titleTxt { font-size:14px; opacity:.9; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
  .prog { height:4px; background:rgba(255,255,255,.25); border-radius:2px; overflow:hidden; }
  .prog i { display:block; height:100%; width:0; background:#22d3a0; }
  .times { display:flex; justify-content:space-between; font-size:11px; opacity:.75; margin-top:5px; }
  .ui-hidden #top, .ui-hidden #bar { opacity:0; }

  /* big centre feedback icon */
  #flash { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.8); z-index:25; pointer-events:none;
    width:84px; height:84px; border-radius:50%; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
    font-size:38px; opacity:0; transition:opacity .25s, transform .25s; }
  #flash.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #startOverlay { position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px; }
  #startOverlay .big { font-size:52px; margin-bottom:16px; }
  #startOverlay h2 { font-size:20px; margin-bottom:10px; }
  #startOverlay p { font-size:14px; opacity:.75; line-height:1.6; margin-bottom:24px; }
  #startOverlay .codeTag { background:#1a2733; border:1px solid #3a4a5a; padding:10px 20px; border-radius:12px; font-size:26px; letter-spacing:4px; margin-bottom:24px; }
  #startBtn { background:#22d3a0; color:#06251c; border:none; font-size:18px; font-weight:700; padding:16px 40px; border-radius:999px; cursor:pointer; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v" playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div id="idle">
    <div class="ic">📺</div>
    <h2>વિડિયોની રાહ જુએ છે…</h2>
    <p>નવા ફોન (કંટ્રોલર)માં<br><b>"ગેલેરીમાંથી વિડિયો પસંદ કરો"</b> દબાવો.</p>
    <div class="codeTag" id="idleCode">—</div>
  </div>

  <div id="top"><span id="pill">કનેક્ટ થઈ રહ્યું છે…</span></div>
  <div id="bar">
    <span id="titleTxt">—</span>
    <div class="prog"><i id="progFill"></i></div>
    <div class="times"><span id="curT">0:00</span><span id="durT">0:00</span></div>
  </div>
  <div id="flash">▶</div>

  <div id="startOverlay">
    <div class="big">📺</div>
    <h2>વિડિયો પ્લેયર શરૂ કરો</h2>
    <p>આ જૂનો ફોન છે. અહીં વિડિયો મોટી સ્ક્રીનમાં ચાલશે.<br>નીચેનો બટન દબાવો જેથી ફુલસ્ક્રીન શરૂ થાય.</p>
    <div class="codeTag" id="codeTag">—</div>
    <button id="startBtn">▶ શરૂ કરો</button>
  </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var room = (params.get('room') || '').trim();
  var v = document.getElementById('v');
  var startOverlay = document.getElementById('startOverlay');
  var startBtn = document.getElementById('startBtn');
  var pill = document.getElementById('pill');
  var titleTxt = document.getElementById('titleTxt');
  var idle = document.getElementById('idle');
  var progFill = document.getElementById('progFill');
  var curT = document.getElementById('curT');
  var durT = document.getElementById('durT');
  var flash = document.getElementById('flash');

  var conn = null, peer = null;
  var lastReport = 0;
  var localObjectUrl = '';
  var incomingFile = null;
  var started = false;
  var playOnReady = false;
  var streamDuration = 0;     // duration provided by controller for live stream
  var hideTimer = null, flashTimer = null;
  var wakeLock = null;

  document.getElementById('codeTag').textContent = 'રૂમ: ' + (room || '—');
  document.getElementById('idleCode').textContent = 'રૂમ: ' + (room || '—');

  function setPill(t, ok){ pill.textContent = t; pill.style.color = ok === false ? '#ff8a8a' : (ok ? '#9fffd9' : '#ffd88a'); }
  function fmt(s){ s = Math.max(0, Math.floor(s||0)); var m = Math.floor(s/60), sec = s%60; return m + ':' + (sec<10?'0':'') + sec; }

  function goFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    try { if (req) req.call(el); } catch(e) {}
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); } catch(e) {}
  }
  async function keepAwake(){
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', function(){ wakeLock = null; }); } } catch(e) {}
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && started) keepAwake(); });

  function showUI(){
    document.body.classList.remove('ui-hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ if (!v.paused) document.body.classList.add('ui-hidden'); }, 3000);
  }
  function showFlash(ic){
    flash.textContent = ic; flash.classList.add('show');
    clearTimeout(flashTimer); flashTimer = setTimeout(function(){ flash.classList.remove('show'); }, 600);
  }
  function getDuration(){ var d = v.duration; return (isFinite(d) && d > 0) ? d : streamDuration; }
  function updateBar(){
    var d = getDuration(), t = v.currentTime || 0;
    curT.textContent = fmt(t); durT.textContent = fmt(d);
    progFill.style.width = d ? Math.min(100, (t / d) * 100) + '%' : '0%';
  }

  function report(type, extra){
    if (!conn || conn.open !== true) return;
    var obj = { type: type, time: v.currentTime || 0, duration: getDuration(), playing: !v.paused, muted: v.muted };
    if (extra) { for (var k in extra) obj[k] = extra[k]; }
    try { conn.send(obj); } catch(e) {}
  }

  function tryPlay(){
    if (!started) { playOnReady = true; return; }
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  }
  function haveVideo(title){
    idle.classList.add('hidden');
    titleTxt.textContent = title || 'વિડિયો';
    showUI();
  }

  function loadBlobVideo(url, title){
    streamDuration = 0;
    if (v.srcObject) v.srcObject = null;
    v.src = url; v.load();
    haveVideo(title);
    tryPlay();
  }

  function handleMsg(m){
    if (!m) return;
    if (m.type === 'hello') { report('status'); }
    else if (m.type === 'cmd') {
      var c = m.cmd;
      if (c === 'toggle') { if (v.paused) { tryPlay(); showFlash('▶'); } else { v.pause(); showFlash('⏸'); } }
      else if (c === 'seek') { if (typeof m.value === 'number') { try { v.currentTime = m.value; } catch(e){} } }
      else if (c === 'skip') { if (typeof m.value === 'number') { try { v.currentTime = Math.max(0, v.currentTime + m.value); } catch(e){} showFlash(m.value < 0 ? '⏪' : '⏩'); } }
      else if (c === 'volume') { try { v.volume = Math.max(0, Math.min(1, m.value)); } catch(e){} showFlash('🔊'); }
      else if (c === 'mute') { v.muted = !v.muted; showFlash(v.muted ? '🔇' : '🔊'); report('status'); }
      showUI();
    } else if (m.type === 'file-start') {
      incomingFile = { id:m.id, name:m.name || 'વિડિયો', mime:m.mime || 'video/mp4', total:m.total || 0, chunks:[], received:0 };
      setPill('વિડિયો આવી રહ્યો છે… 0%');
    } else if (m.type === 'file-chunk' && incomingFile && m.id === incomingFile.id) {
      incomingFile.chunks[m.index] = m.data;
      incomingFile.received++;
      var pct = incomingFile.total ? Math.round((incomingFile.received / incomingFile.total) * 100) : 0;
      setPill('વિડિયો આવી રહ્યો છે… ' + pct + '%');
    } else if (m.type === 'file-end' && incomingFile && m.id === incomingFile.id) {
      if (incomingFile.received !== incomingFile.total) { setPill('વિડિયો પૂરો મળ્યો નથી — ફરી મોકલો', false); incomingFile = null; return; }
      var completed = incomingFile; incomingFile = null;
      try {
        var blob = new Blob(completed.chunks, { type:completed.mime });
        if (localObjectUrl) URL.revokeObjectURL(localObjectUrl);
        localObjectUrl = URL.createObjectURL(blob);
        loadBlobVideo(localObjectUrl, completed.name);
        setPill('કંટ્રોલર જોડાયેલ છે ✓', true);
        report('file-ready', { name:completed.name });
      } catch(e) { setPill('વિડિયો તૈયાર કરવામાં ભૂલ આવી', false); }
    }
  }

  // ---- PeerJS (player hosts the room) ----
  var PEER_PREFIX = 'rvideo-';
  function connect(){
    if (!window.Peer) { setPill('PeerJS લોડ ન થયું — ઇન્ટરનેટ ચેક કરો', false); return; }
    peer = new Peer(PEER_PREFIX + room);
    peer.on('open', function(){ setPill('રૂમ તૈયાર — કંટ્રોલરની રાહ જુએ છે'); });
    peer.on('call', function(call){
      call.answer();
      call.on('stream', function(stream){
        if (localObjectUrl) { URL.revokeObjectURL(localObjectUrl); localObjectUrl = ''; }
        v.removeAttribute('src');
        v.srcObject = stream;
        streamDuration = (call.metadata && call.metadata.duration) || 0;
        haveVideo((call.metadata && call.metadata.name) || 'લાઇવ વિડિયો');
        setPill('● લાઇવ', true);
        tryPlay();
      });
      call.on('close', function(){ setPill('સ્ટ્રીમ બંધ થયું'); });
      call.on('error', function(){ setPill('સ્ટ્રીમમાં ભૂલ આવી', false); });
    });
    peer.on('connection', function(connection){
      conn = connection;
      conn.on('open', function(){ setPill('કંટ્રોલર જોડાયેલ છે ✓', true); });
      conn.on('data', handleMsg);
      conn.on('close', function(){ setPill('કંટ્રોલર છૂટું પડ્યું', false); conn = null; });
    });
    peer.on('error', function(err){
      var t = 'કનેક્શન ભૂલ';
      if (err && err.type === 'unavailable-id') t = 'આ કોડ પહેલેથી વપરાયો છે — બીજો કોડ વાપરો';
      setPill(t, false);
    });
    peer.on('disconnected', function(){ if (!peer.destroyed) peer.reconnect(); });
  }

  startBtn.addEventListener('click', function(){
    started = true;
    startOverlay.style.display = 'none';
    goFullscreen();
    keepAwake();
    showUI();
    if (playOnReady || v.src || v.srcObject) { var p = v.play(); if (p && p.catch) p.catch(function(){}); playOnReady = false; }
  });

  v.addEventListener('play', function(){ report('status'); showUI(); });
  v.addEventListener('pause', function(){ report('status'); showUI(); });
  v.addEventListener('loadedmetadata', function(){ updateBar(); report('status'); });
  v.addEventListener('ended', function(){ report('ended'); showUI(); });
  v.addEventListener('timeupdate', function(){
    updateBar();
    var now = Date.now();
    if (now - lastReport > 1000) { lastReport = now; report('status'); }
  });
  // tap on screen: show controls; double-tap-less simple behaviour
  document.getElementById('stage').addEventListener('click', function(){ showUI(); });

  if (!room) { setPill('રૂમ કોડ ખૂટે છે', false); }
  else connect();
})();
</script>
</body>
</html>
