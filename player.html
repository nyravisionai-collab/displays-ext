<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>વિડિયો પ્લેયર</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:#000; color:#fff; font-family: system-ui, Roboto, sans-serif; overflow:hidden; }
  #stage { width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; background:#000; object-fit: contain; display:block; }
  #startOverlay { position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px; }
  #startOverlay .big { font-size:52px; margin-bottom:16px; }
  #startOverlay h2 { font-size:20px; margin-bottom:10px; }
  #startOverlay p { font-size:14px; opacity:.75; line-height:1.6; margin-bottom:24px; }
  #startOverlay .codeTag { background:#1a2733; border:1px solid #3a4a5a; padding:10px 20px; border-radius:12px; font-size:26px; letter-spacing:4px; margin-bottom:24px; }
  #startBtn { background:#22d3a0; color:#06251c; border:none; font-size:18px; font-weight:700; padding:16px 40px; border-radius:999px; cursor:pointer; }
  #statusPill { position:fixed; top:12px; left:0; right:0; text-align:center; z-index:20; pointer-events:none; }
  #statusPill span { background:rgba(0,0,0,.55); padding:6px 14px; border-radius:999px; font-size:12px; color:#9fffd9; display:inline-block; }
  #titleBar { position:fixed; bottom:0; left:0; right:0; z-index:15; text-align:center; padding:18px; background:linear-gradient(transparent, rgba(0,0,0,.85)); }
  #titleBar span { font-size:14px; opacity:.9; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v" playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div id="titleBar"><span id="titleTxt">—</span></div>
  <div id="statusPill"><span id="pill">કનેક્ટ થઈ રહ્યું છે…</span></div>

  <div id="startOverlay">
    <div class="big">📺</div>
    <h2>વિડિયો પ્લેયર શરૂ કરો</h2>
    <p>આ જૂનો ફોન છે. અહીં વિડિયો મોટી સ્ક્રીનમાં ચાલશે.<br>નીચેનો બટન દબાવો જેથી ફુલસ્ક્રીન શરૂ થાય.</p>
    <div class="codeTag" id="codeTag">—</div>
    <button id="startBtn">▶ શરૂ કરો</button>
  </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var room = (params.get('room') || '').trim();
  var v = document.getElementById('v');
  var startOverlay = document.getElementById('startOverlay');
  var startBtn = document.getElementById('startBtn');
  var pill = document.getElementById('pill');
  var titleTxt = document.getElementById('titleTxt');
  var codeTag = document.getElementById('codeTag');

  var conn = null;
  var peer = null;
  var lastReport = 0;
  var currentUrl = '';
  var localObjectUrl = '';
  var incomingFile = null;
  var playOnReady = false;   // remote asked to play before user tapped start

  codeTag.textContent = 'રૂમ: ' + (room || '—');

  function setPill(t, ok){ pill.textContent = t; pill.style.color = ok === false ? '#ff8a8a' : (ok ? '#9fffd9' : '#ffd88a'); }

  function goFullscreen(){
    var el = v;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
    try { if (req) req.call(el); } catch(e) {}
  }

  function report(type, extra){
    if (!conn || conn.open !== true) return;
    var obj = { type: type, time: v.currentTime || 0, duration: v.duration || 0, playing: !v.paused };
    if (extra) { for (var k in extra) obj[k] = extra[k]; }
    try { conn.send(obj); } catch(e) {}
  }

  function loadVideo(url, title, playIt, keepObjectUrl){
    if (!keepObjectUrl && localObjectUrl) {
      URL.revokeObjectURL(localObjectUrl);
      localObjectUrl = '';
    }
    currentUrl = url;
    titleTxt.textContent = title || '';
    if (v.srcObject) v.srcObject = null;
    v.src = url;
    v.load();
    if (playIt) {
      if (startOverlay.style.display === 'none') {
        var p = v.play(); if (p && p.catch) p.catch(function(){});
      } else {
        playOnReady = true;
      }
    }
  }

  function handleMsg(m){
    if (!m) return;
    if (m.type === 'hello') {
      if (m.playlist && m.playlist.length && m.url) {
        loadVideo(m.url, m.title, m.playing === true);
      }
    } else if (m.type === 'cmd') {
      var c = m.cmd;
      if (c === 'toggle') { if (v.paused) v.play(); else v.pause(); }
      else if (c === 'play') { v.play(); }
      else if (c === 'pause') { v.pause(); }
      else if (c === 'seek') { if (typeof m.value === 'number') { try { v.currentTime = m.value; } catch(e){} } }
      else if (c === 'volume') { try { v.volume = m.value; } catch(e){} }
      else if (c === 'mute') { v.muted = !v.muted; }
      else if (c === 'play' || c === 'next' || c === 'prev' || c === 'playindex') {
        // these come with a full load in 'hello' or 'load'; ignore
      }
    } else if (m.type === 'load') {
      loadVideo(m.url, m.title, m.playing === true);
    } else if (m.type === 'file-start') {
      incomingFile = { id:m.id, name:m.name || 'વિડિયો', mime:m.mime || 'video/mp4', size:m.size || 0, total:m.total || 0, chunks:[], received:0 };
      setPill('વિડિયો આવી રહ્યો છે… 0%');
    } else if (m.type === 'file-chunk' && incomingFile && m.id === incomingFile.id) {
      incomingFile.chunks[m.index] = m.data;
      incomingFile.received++;
      var pct = incomingFile.total ? Math.round((incomingFile.received / incomingFile.total) * 100) : 0;
      setPill('વિડિયો આવી રહ્યો છે… ' + pct + '%');
    } else if (m.type === 'file-end' && incomingFile && m.id === incomingFile.id) {
      if (incomingFile.received !== incomingFile.total) {
        setPill('વિડિયો પૂરો મળ્યો નથી — ફરી મોકલો', false);
        incomingFile = null;
        return;
      }
      var completed = incomingFile;
      incomingFile = null;
      try {
        var blob = new Blob(completed.chunks, { type:completed.mime });
        if (localObjectUrl) URL.revokeObjectURL(localObjectUrl);
        localObjectUrl = URL.createObjectURL(blob);
        loadVideo(localObjectUrl, completed.name, true, true);
        setPill('વિડિયો તૈયાર છે ✓', true);
        report('file-ready', { name:completed.name });
      } catch(e) {
        setPill('વિડિયો તૈયાર કરવામાં ભૂલ આવી', false);
      }
    }
  }

  // ---- PeerJS (player is the host that others connect to) ----
  var PEER_PREFIX = 'rvideo-';
  function connect(){
    if (!window.Peer) { setPill('PeerJS લોડ ન થયું — ઇન્ટરનેટ ચેક કરો', false); return; }
    peer = new Peer(PEER_PREFIX + room);
    peer.on('open', function(){ setPill('રૂમ તૈયાર — કંટ્રોલરની રાહ જુએ છે'); });
    peer.on('call', function(call){
      call.answer();
      call.on('stream', function(stream){
        if (localObjectUrl) { URL.revokeObjectURL(localObjectUrl); localObjectUrl = ''; }
        v.removeAttribute('src');
        v.srcObject = stream;
        titleTxt.textContent = (call.metadata && call.metadata.name) || 'લાઇવ વિડિયો';
        setPill('● લાઇવ સ્ટ્રીમ જોડાયેલ છે', true);
        if (startOverlay.style.display === 'none') {
          var p = v.play(); if (p && p.catch) p.catch(function(){});
        } else {
          playOnReady = true;
        }
      });
      call.on('close', function(){ setPill('લાઇવ સ્ટ્રીમ બંધ થયું', false); });
      call.on('error', function(){ setPill('લાઇવ સ્ટ્રીમમાં ભૂલ આવી', false); });
    });
    peer.on('connection', function(connection){
      conn = connection;
      conn.on('open', function(){
        setPill('કંટ્રોલર જોડાયેલ છે ✓');
        playOnReady = false;
      });
      conn.on('data', handleMsg);
      conn.on('close', function(){ setPill('કંટ્રોલર છૂટું પડ્યું'); conn = null; });
    });
    peer.on('error', function(err){
      var t = 'કનેક્શન ભૂલ';
      if (err && err.type === 'unavailable-id') t = 'આ કોડ પહેલેથી વપરાયો છે — બીજો કોડ વાપરો';
      else if (err && err.type === 'peer-unavailable') t = 'કંટ્રોલર હજુ મળ્યું નથી';
      setPill(t, false);
    });
    peer.on('disconnected', function(){ if (!peer.destroyed) peer.reconnect(); });
  }

  startBtn.addEventListener('click', function(){
    startOverlay.style.display = 'none';
    goFullscreen();
    if (v.src) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    if (playOnReady) { var p2 = v.play(); if (p2 && p2.catch) p2.catch(function(){}); playOnReady = false; }
  });

  v.addEventListener('play', function(){ report('status'); });
  v.addEventListener('pause', function(){ report('status'); });
  v.addEventListener('loadedmetadata', function(){ report('status'); });
  v.addEventListener('ended', function(){ report('ended'); });
  v.addEventListener('timeupdate', function(){
    var now = Date.now();
    if (now - lastReport > 1000) { lastReport = now; report('status'); }
  });
  v.addEventListener('click', function(){
    var tb = document.getElementById('titleBar');
    tb.style.display = (tb.style.display === 'none') ? '' : 'none';
  });

  if (!room) { setPill('રૂમ કોડ ખૂટે છે', false); }
  else connect();
})();
</script>
</body>
</html>
